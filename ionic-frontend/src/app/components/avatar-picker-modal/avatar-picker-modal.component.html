<ion-header>
    <ion-toolbar color="dark">
        <ion-title i18n="@@selectAvatar">Seleziona Avatar</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="confirmSelection()" i18n="@@save">Salva</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    @for (bundle of avatars(); track bundle.bundle) {
        <div class="form-section-title">{{ bundle.bundle }}</div>

        <div class="image-row">
            @for (avatar of bundle.images; track avatar) {
                <div
                    class="red-sphere"
                    (click)="select(avatar)"
                    [class.active]="avatar === selectedAvatar()"
                >
                    <div class="smaller-sphere">
                        <img
                            [src]="avatar | backendUrl: 'static'"
                            alt="Avatar"
                        />
                    </div>
                </div>
            }
        </div>
    }
</ion-content>
