<ion-header>
    <ion-toolbar color="primary">
        <ion-title i18n="@@changePasswordModal_title">Modifica Password</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismiss()" i18n="@@changePasswordModal_close">Chiudi</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <ion-input
            label="Password Attuale"
            i18n-label="@@changePasswordModal_currentPassLabel"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="currentPassword"
            [errorText]="getCurrentPasswordError()"
            class="ion-margin-bottom"
        >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-input
            label="Nuova Password"
            i18n-label="@@changePasswordModal_newPassLabel"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="newPassword"
            [errorText]="getNewPasswordError()"
            class="ion-margin-bottom"
        >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-input
            label="Conferma Nuova Password"
            i18n-label="@@changePasswordModal_confirmPassLabel"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="confirmPassword"
            [errorText]="getConfirmPasswordError()"
            class="ion-margin-bottom"
        >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-button
            expand="block"
            type="submit"
            [disabled]="passwordForm.invalid"
            class="ion-margin-top"
            i18n="@@changePasswordModal_submitBtn"
        >
            Aggiorna Password
        </ion-button>
    </form>
</ion-content>
