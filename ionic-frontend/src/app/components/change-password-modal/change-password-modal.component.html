<ion-header>
    <ion-toolbar color="primary">
        <ion-title>Modifica Password</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismiss()">Chiudi</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <ion-input
            label="Password Attuale"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="currentPassword"
            [errorText]="getCurrentPasswordError()"
            class="ion-margin-bottom"
        >
            <!-- Pulsante nativo per mostrare/nascondere -->
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-input
            label="Nuova Password"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="newPassword"
            [errorText]="getNewPasswordError()"
            class="ion-margin-bottom"
        >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-input
            label="Conferma Nuova Password"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="confirmPassword"
            [errorText]="getConfirmPasswordError()"
            class="ion-margin-bottom"
        >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-button
            expand="block"
            type="submit"
            [disabled]="passwordForm.invalid"
            class="ion-margin-top"
        >
            Aggiorna Password
        </ion-button>
    </form>
</ion-content>
