<div class="episode-card" (click)="onPlay($event)">
    <div class="thumb-container">
        <img
            [src]="
                episode.ThumbnailURI
                    ? (episode.ThumbnailURI | backendUrl: 'static')
                    : ('episode_thumbnails/bleach.png' | backendUrl: 'static')
            "
            [alt]="episode.Title"
        />

        @if (episode?.progress >= 100 || episode?.isCompleted === 1) {
            <div class="progress-bar-bg">
                <div class="progress-bar-fill completed" style="width: 100%"></div>
            </div>
        } @else if (episode?.progress > 0) {
            <div class="progress-bar-bg">
                <div
                    class="progress-bar-fill"
                    [style.width]="episode!.progress + '%'"
                ></div>
            </div>
        }

        <div class="play-overlay">
            <ion-icon name="play-circle"></ion-icon>
        </div>

        <span class="duration-badge">{{ episode.Duration / 60 | number:'1.0-0' }} min</span>
    </div>

  <div class="ep-info">
    <div>
      <h4 i18n="@@episode" class="ep-number">Episodio {{ episode.EpisodeNumber }}</h4>
      <h3 class="ep-title">{{ episode.Title }}</h3>
      <p class="ep-desc">{{ episode.Description }}</p>
    </div>
    
    <div class="ep-bottom-row">
      <ion-icon name="information-circle-outline" class="info-btn" (click)="onInfo($event)"></ion-icon>
    </div>
  </div>
</div>
