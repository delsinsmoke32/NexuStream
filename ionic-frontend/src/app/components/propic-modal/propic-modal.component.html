<ion-header>
    <ion-toolbar color="dark">
        <ion-title>Aggiungi avatar</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismiss()">Annulla</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form [formGroup]="propicForm" (ngSubmit)="uploadPicture()">
        <ion-item fill="outline" mode="md">
            <ion-label position="stacked">Bundle</ion-label>
            <ion-input
                type="text"
                formControlName="bundle"
                placeholder="Inserisci bundle"
            ></ion-input>
        </ion-item>

        <div class="upload-container">
            <input
                type="file"
                #fileInput
                (change)="onFileSelect($event)"
                accept="image/*"
                style="display: none"
            />

            <ion-button expand="block" fill="outline" (click)="triggerSelect()">
                <ion-icon name="camera-outline" slot="start"></ion-icon>
                Select Picture
            </ion-button>

            @if (imagePreview()) {
                <div class="ion-text-center ion-padding-top">
                    <ion-avatar
                        style="margin: 0 auto; width: 120px; height: 120px"
                    >
                        <img [src]="imagePreview()" alt="Preview" />
                    </ion-avatar>
                </div>
            }

            @if (selectedFile(); as file) {
                <ion-text color="medium" class="ion-text-center">
                    <p style="margin: 15px 0">Selected: {{ file.name }}</p>
                </ion-text>
            }

            <ion-button
                expand="block"
                type="submit"
                [disabled]="
                    propicForm.invalid || !selectedFile() || isUploading()
                "
            >
                {{ isUploading() ? 'Uploading...' : 'Upload to Server' }}
            </ion-button>
        </div>
