<div class="player-container">
  <div class="video-wrapper">
    <video #target class="video-js vjs-default-skin vjs-big-play-centered video-placeholder" controls preload="auto" playsinline></video>
  </div>

  <div class="floating-actions-container">
    
    @if (showSkipIntro()) {
      <button class="action-btn" (click)="skipTo(activeIntroEnd)">
        SALTA INTRO
      </button>
    }

    @if (showSkipRecap()) {
      <button class="action-btn" (click)="skipTo(activeRecapEnd)">
        SALTA RIASSUNTO
      </button>
    }

    @if (showCreditsOverlay()) {
      <div class="credits-buttons-wrapper">
        <button class="action-btn credits-btn" (click)="hideOverlay()">
          GUARDA I TITOLI
        </button>

        <button class="action-btn next-ep-btn" (click)="triggerNextEpisode()">
          <span>PROSSIMO EPISODIO</span>
        </button>
      </div>
    }
  </div>
</div>
