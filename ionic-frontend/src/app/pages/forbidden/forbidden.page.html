<ion-content class="ion-padding ion-text-center flex-center">
    <div class="error-container">
        <ion-icon
            name="shield-outline"
            color="primary"
            style="font-size: 6rem"
        ></ion-icon>

        <h1
            style="
                font-size: 4rem;
                font-weight: 900;
                margin: 10px 0 0 0;
                color: var(--ion-color-primary);
            "
        >
            403
        </h1>
        <h2 i18n="@@deniedAccess" style="font-weight: bold; margin-bottom: 20px">ACCESSO NEGATO</h2>

        <p i18n="@@noPermission" style="color: #aaa; max-width: 280px; margin: 0 auto 30px auto">
            Non hai i permessi necessari per visualizzare questa risorsa.
        </p>

        <ion-button i18n="@@backHome"
            color="primary"
            (click)="goToHome()"
            expand="block"
            fill="solid"
        >
            <ion-icon slot="start" name="home-outline"></ion-icon>
            Torna alla Home
        </ion-button>
    </div>
</ion-content>
