<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title i18n="@@accountRecovery" color="primary">Recupero Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding content-flex-center">
  <ion-card class="auth-card ion-no-margin">
    <ion-card-header class="ion-text-center">
      <ion-card-title color="primary" class="brand-title">NexuStream</ion-card-title>
      <ion-card-subtitle i18n="@@insertEmailRecovery" class="ion-margin-top">
        Inserisci la tua email per ricevere il link di ripristino temporaneo.
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        
        <ion-item fill="outline" mode="md" color="secondary" class="ion-margin-bottom custom-input">
          <ion-input 
            type="email" 
            formControlName="email" 
            label="Indirizzo Email" 
            labelPlacement="floating" 
            placeholder="esempio@nexustream.it">
          </ion-input>
        </ion-item>

        <ion-button i18n="@@sendOTP"
          type="submit" 
          expand="block" 
          color="primary" 
          class="action-submit-btn ion-margin-top" 
          [disabled]="forgotForm.invalid || isLoading"> @if (isLoading) {
            Invio in corso...
          } @else {
            Invia Link di Reset
          }
        </ion-button>
      </form>

      <div class="ion-text-center ion-margin-top links-container">
        <ion-text color="medium">
          <a i18n="@@backLogin" routerLink="/login" class="ion-activatable auth-link">Torna alla pagina di Accesso</a>
        </ion-text>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
