<ion-header>
  <ion-toolbar color="dark">
      <ion-buttons slot="start">
        <ion-menu-button color="danger"></ion-menu-button>
      </ion-buttons>

      <ion-title routerLink="/home" color="danger" class="titolo-cliccabile">NexuStream</ion-title>

      <ion-buttons slot="end">
        <ion-button color="light" routerLink="/search">
          <ion-icon slot="icon-only" name="search-outline"></ion-icon>
        </ion-button>
        <ion-button color="light" (click)="openProfileMenu($event)">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    <!--</ng-container>-->
  </ion-toolbar>
</ion-header>

<ion-content color="dark">
  <div class="category-list">
    <h3>I PIÙ VISTI QUESTA SETTIMANA</h3>
    <div class ="horizontal-scroll">
      <div class = "anime-card" *ngFor="let anime of popularAnimes">
        <img [src]="anime.posterUrl" alt="{{ anime.title }}" />
      </div>
    </div>
  </div>

  <div class="category-list">
    <h3>AGGIUNTI DI RECENTE</h3>
    <div class ="horizontal-scroll">
      <div class = "anime-card" *ngFor="let anime of recentlyAddedAnimes">
        <img [src]="anime.posterUrl" alt="{{ anime.title }}" />
      </div>
    </div>
  </div>

  <div class="category-list">
    <h3>CONTINUA A GUARDARE</h3>
    <div class ="horizontal-scroll">
      <div class ="anime-card" *ngFor="let anime of continueWatchingAnimes">
        <img [src]="anime.posterUrl" alt="{{ anime.title }}" />
        <p>{{ anime.title }} - Ep. {{ anime.currentEpisode }}</p>
      </div>
    </div>
  </div>

<!-- Menu a tendina per il profilo -->
<ion-popover #profilePopover (didDismiss)="onPopoverDismiss()">
  <ng-template>
    <ion-list color="dark">
      <ion-item button routerLink="/settings" (click)="openUserSettings()">
        <ion-icon slot="start" name="settings-outline"></ion-icon>
        Impostazioni
      </ion-item>
      <ion-item button routerLink="/favourites" (click)="openFavorites()">
        <ion-icon slot="start" name="heart-outline"></ion-icon>
        Lista Preferiti
      </ion-item>
      <ion-item button (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Logout
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>
