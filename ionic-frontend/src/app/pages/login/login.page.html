<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>
            Login on <p id="nexus" style="display: inline; font-weight: bolder; color: var(--ion-color-primary-tint);">NexuStream</p>
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
    <div class="login-container">
        <div class="text-heading">
            <h1>Welcome to NexuStream</h1>
        </div>

        <ion-card class="form-log-in-card">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <ion-card-content>
                    
                    <div class="input-group">
                        <ion-label position="stacked">Email</ion-label>
                        <ion-item lines="none" class="custom-input">
                            <ion-input
                                type="email"
                                formControlName="email"
                                errorText="Inserisci un indirizzo email valido"
                                placeholder="example@mail.com"
                            ></ion-input>
                        </ion-item>
                    </div>

                    <div class="input-group" style="margin-top: 15px;">
                        <ion-label position="stacked">Password</ion-label>
                        <ion-item lines="none" class="custom-input">
                            <ion-input
                                formControlName="password"
                                type="password"
                                errorText="La password deve essere di almeno 8 caratteri"
                                placeholder="password"
                            >
                                <ion-input-password-toggle
                                    slot="end"
                                    color="primary-contrast"
                                ></ion-input-password-toggle>
                            </ion-input>
                        </ion-item>
                    </div>

                    <div class="button-container" style="margin-top: 25px;">
                        <ion-button
                            type="submit"
                            expand="block"
                            class="login-button"
                            [disabled]="loginForm.invalid"
                        >
                            Login
                        </ion-button>
                    </div>

                    <div class="text-link" style="margin-top: 15px; text-align: center;">
                        <a href="#" style="text-decoration: none; font-size: 0.9rem;">Forgot password?</a>
                    </div>
                    
                </ion-card-content>
            </form>
        </ion-card>
    </div>
</ion-content>
