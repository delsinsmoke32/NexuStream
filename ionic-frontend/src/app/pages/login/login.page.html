<ion-header [translucent]="true">
    <ion-toolbar color="dark">
        <ion-title>
            Login on
            <span style="color: var(--ion-color-primary-tint); font-weight: bolder;">
                NexuStream
            </span>
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
    <div class="login-container">
        <div class="text-heading">
            <h1>Welcome to NexuStream</h1>
        </div>

        <ion-card class="form-log-in-card" color="secondary">
            <ion-card-content>
                
                <div class="input-group">
                    <ion-label position="stacked">Email</ion-label>
                    <ion-item lines="none" class="custom-input">
                        <ion-input
                            type="email"
                            [(ngModel)]="loginData.email"
                            placeholder="example@mail.com"
                        ></ion-input>
                    </ion-item>
                </div>

                <div class="input-group ion-margin-top">
                    <ion-label position="stacked">Password</ion-label>
                    <ion-item lines="none" class="custom-input">
                        <ion-input
                            type="password"
                            [(ngModel)]="loginData.password"
                            placeholder="password"
                        ></ion-input>
                    </ion-item>
                </div>

                <div class="button-container ion-margin-top">
                    <ion-button expand="block" (click)="login()" class="login-button" color="var(--ion-color-dark)">
                        Login
                    </ion-button>
                </div>

                <div class="text-link ion-text-center ion-margin-top">
                    <a href="#" style="color: var(--ion-secondary); text-decoration: none;">Forgot password?</a>
                </div>
                
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
