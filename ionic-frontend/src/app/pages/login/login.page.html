<ion-header translucent>
    <ion-toolbar>
        <ion-title i18n="@@loginOn" slot="start">
            Accesso su
            <ion-text color="primary">
                <strong> NexuStream </strong>
            </ion-text>
        </ion-title>
        <app-language-switcher slot="end"></app-language-switcher>
    </ion-toolbar>
</ion-header>

<ion-content fullscreen class="login-content">
    <div class="login-container flex-centered">
        <div class="text-heading">
            <h1 i18n="@@Welcome_to_NexuStream">Benvenuto su NexuStream</h1>
        </div>

        <ion-card class="form-log-in-card">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <ion-card-content>
                    <div class="input-group">
                        <ion-label position="stacked">Email</ion-label>
                        <ion-item lines="none" class="custom-input">
                            <ion-input
                                type="email"
                                formControlName="email"
                                errorText="Inserisci un indirizzo email valido"
                                placeholder="example@mail.com"
                            ></ion-input>
                        </ion-item>
                    </div>

                    <div class="input-group" style="margin-top: 15px">
                        <ion-label position="stacked">Password</ion-label>
                        <ion-item lines="none" class="custom-input">
                            <ion-input
                                formControlName="password"
                                type="password"
                                errorText="La password deve essere di almeno 8 caratteri"
                                placeholder="password"
                            >
                                <ion-input-password-toggle
                                    slot="end"
                                    color="primary-contrast"
                                ></ion-input-password-toggle>
                            </ion-input>
                        </ion-item>
                    </div>

                    <div class="button-container" style="margin-top: 25px">
                        <ion-button i18n="@@login"
                            type="submit"
                            expand="block"
                            class="login-button"
                            [disabled]="loginForm.invalid"
                        >
                            Accesso
                        </ion-button>
                    </div>

                    <div class="text-link ion-text-center ion-margin-top">
                        <a i18n="@@forgotPass" routerLink="/forgot-password" class="auth-link">Password dimenticata?</a>
                    </div>
                    
                </ion-card-content>
            </form>
        </ion-card>
    </div>
</ion-content>
