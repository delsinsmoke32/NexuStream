<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title i18n="@@registerON" slot="start">
            Registrati su
            <ion-text color="primary">
                <strong> NexuStream </strong>
            </ion-text>
        </ion-title>
        <app-language-switcher slot="end"></app-language-switcher>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
    <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="split-wrapper">
            <div class="column left-column">
                <h1 i18n="@@Welcome_to_NexuStream" class="title">Benvenuto su NexuStream</h1>

                <ion-card class="form-log-in-card">
                    <ion-card-content>
                        <div class="input-group">
                            <ion-label position="stacked">Email</ion-label>
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="email"
                                    errorText="Indirizzo email non valido"
                                    i18n-errorText="@@invalidEmailError"
                                    type="email"
                                    placeholder="esempio@mail.com"
                                    i18n-placeholder="@@exampleEmail"
                                ></ion-input>
                            </ion-item>
                        </div>

                        <div class="input-group" style="margin-top: 15px">
                            <ion-label position="stacked">Password</ion-label>
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="password"
                                    errorText="Minimo 8 caratteri richiesti"
                                    i18n-errorText="@@minimumCharPassError"
                                    type="password"
                                    placeholder="password"
                                >
                                    <ion-input-password-toggle
                                        slot="end"
                                        color="primary-contrast"
                                    ></ion-input-password-toggle>
                                </ion-input>
                            </ion-item>
                        </div>

                        <div class="input-group" style="margin-top: 15px">
                            <ion-label i18n="@@confirmPass" position="stacked"
                                >Conferma Password</ion-label
                            >
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="conf_password"
                                    type="password"
                                    placeholder="Ripeti la password"
                                    i18n-placeholder="@@repeatPass"
                                >
                                    <ion-input-password-toggle
                                        slot="end"
                                        color="primary-contrast"
                                    ></ion-input-password-toggle>
                                </ion-input>
                            </ion-item>
                        </div>

                        <div class="button-container" style="margin-top: 25px">
                            <ion-button i18n="@@register"
                                type="submit"
                                expand="block"
                                class="register-button"
                                [disabled]="registerForm.invalid"
                            >
                                Registrati
                            </ion-button>
                        </div>
                    </ion-card-content>
                </ion-card>
            </div>

            <div class="column right-column">
                <h1 i18n="@@name" class="title">Qual è il tuo nome?</h1>

                <ion-card class="form-log-in-card">
                    <ion-card-content>
                        <div class="input-group">
                            <ion-label i18n="@@username" position="stacked">Nome utente</ion-label>
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="username"
                                    errorText="Lo username è obbligatorio (min 3 caratteri)"
                                    i18n-errorText="@@obligatoryUser"
                                    type="text"
                                    placeholder="nome utente"
                                    i18n-placeholder="@@userPlaceHolder"
                                ></ion-input>
                            </ion-item>
                        </div>
                    </ion-card-content>
                </ion-card>

                <div class="red-sphere">
                    <div class="smaller-sphere">
                        <img
                            [src]='"static/avatars/avatar-000.png" | backendUrl'
                            alt="Avatar"
                        />
                    </div>
                </div>
            </div>
        </div>
    </form>
</ion-content>
