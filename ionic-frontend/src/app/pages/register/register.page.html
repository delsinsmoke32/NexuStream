<ion-header [translucent]="true" class="ion-no-border">
    <ion-toolbar>
        <div slot="start" class="return-home-container">
            <span class="full-text" i18n="@@dontWantRegister">Non vuoi registrarti? </span>
            <a routerLink="/tabs/home" class="home-link" i18n="@@backToHome">Torna alla home</a>
        </div>
        
        <app-language-switcher slot="end"></app-language-switcher>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
    <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="split-wrapper">
            <div class="column left-column">
                <h1 i18n="@@Welcome_to_NexuStream" class="title">
                    Benvenuto su NexuStream
                </h1>

                <ion-card class="form-log-in-card">
                    <ion-card-content>
                        <div class="input-group">
                            <ion-label position="stacked">Email</ion-label>
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="email"
                                    errorText="Indirizzo email non valido"
                                    i18n-errorText="@@invalidEmailError"
                                    type="email"
                                    placeholder="esempio@mail.com"
                                    i18n-placeholder="@@exampleEmail"
                                ></ion-input>
                            </ion-item>
                        </div>

                        <div class="input-group" style="margin-top: 15px">
                            <ion-label position="stacked">Password</ion-label>
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="password"
                                    errorText="Minimo 8 caratteri richiesti, max 24"
                                    i18n-errorText="@@minimumCharPassError"
                                    type="password"
                                    placeholder="password"
                                >
                                    <ion-input-password-toggle
                                        slot="end"
                                        color="primary-contrast"
                                    ></ion-input-password-toggle>
                                </ion-input>
                            </ion-item>
                        </div>

                        <div class="input-group" style="margin-top: 15px">
                            <ion-label i18n="@@confirmPass" position="stacked"
                                >Conferma Password</ion-label
                            >
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="conf_password"
                                    type="password"
                                    placeholder="Ripeti la password"
                                    i18n-placeholder="@@repeatPass"
                                >
                                    <ion-input-password-toggle
                                        slot="end"
                                        color="primary-contrast"
                                    ></ion-input-password-toggle>
                                </ion-input>
                            </ion-item>
                        </div>

                        <div class="button-container" style="margin-top: 25px">
                            <ion-button
                                i18n="@@register"
                                type="submit"
                                expand="block"
                                class="register-button"
                                [disabled]="registerForm.invalid"
                            >
                                Registrati
                            </ion-button>
                        </div>
                        <div
                            class="text-link"
                            style="margin-top: 0px; text-align: center"
                        >
                            <a
                                routerLink="/login"
                                style="font-size: 0.9rem"
                                i18n="@@goToLogin"
                                >Hai già un account? Vai al login!</a
                            >
                        </div>
                    </ion-card-content>
                </ion-card>
            </div>

            <div class="column right-column">
                <h1 i18n="@@name" class="title">Qual è il tuo nome?</h1>

                <ion-card class="form-log-in-card">
                    <ion-card-content>
                        <div class="input-group">
                            <ion-label i18n="@@username" position="stacked"
                                >Nome utente</ion-label
                            >
                            <ion-item lines="none" class="custom-input">
                                <ion-input
                                    formControlName="username"
                                    errorText="Lo username è obbligatorio (min 3 caratteri, max 24)"
                                    i18n-errorText="@@obligatoryUser"
                                    type="text"
                                    placeholder="nome utente"
                                    i18n-placeholder="@@userPlaceHolder"
                                ></ion-input>
                            </ion-item>
                        </div>
                    </ion-card-content>
                </ion-card>

                <div class="img-picker-cont">
                    <div class="red-sphere" (click)="triggerImageSelection()">
                        <div class="smaller-sphere">
                            <img
                                [src]="selected() | backendUrl: 'static'"
                                alt="Avatar"
                            />
                        </div>
                    </div>
                    <ion-button
                        fill="clear"
                        class="edit-btn"
                        (click)="triggerImageSelection()"
                    >
                        <ion-icon
                            slot="icon-only"
                            name="swap-horizontal-outline"
                        ></ion-icon>
                    </ion-button>
                </div>
            </div>
        </div>
    </form>
</ion-content>
