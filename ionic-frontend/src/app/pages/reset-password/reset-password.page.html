<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title i18n="@@securityAccount" color="primary">Sicurezza Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding content-flex-center">
  <ion-card class="auth-card ion-no-margin">
    <ion-card-header class="ion-text-center">
      <ion-card-title color="primary" class="brand-title">NexuStream</ion-card-title>
      <ion-card-subtitle i18n="@@choosePass" class="ion-margin-top">
        Scegli una nuova password sicura per il tuo account.
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        
        <ion-item fill="outline" mode="md" color="secondary" class="ion-margin-bottom custom-input">
          <ion-input 
            type="password" 
            formControlName="newPassword" 
            label="Nuova Password"
            i18n-label="@@newPassword" 
            labelPlacement="floating" 
            placeholder="••••••••">
          </ion-input>
        </ion-item>

        <ion-item fill="outline" mode="md" color="secondary" class="custom-input">
          <ion-input 
            type="password" 
            formControlName="confirmPassword" 
            label="Conferma Nuova Password"
            i18n-label="@@confirmNewPass" 
            labelPlacement="floating" 
            placeholder="••••••••">
          </ion-input>
        </ion-item>

        @if (resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched) {
          <div class="error-container ion-padding-start ion-margin-top">
            <ion-text i18n="@@passNotCoincide" color="danger">
            Le password inserite non coincidono.
            </ion-text>
          </div>
        }

        <ion-button i18n="@@updatePassword"
          type="submit" 
          expand="block" 
          color="primary" 
          class="action-submit-btn ion-margin-top" 
          [disabled]="resetForm.invalid">
          Aggiorna Password
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
