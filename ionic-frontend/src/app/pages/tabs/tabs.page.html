<ion-popover #profilePopover dismissOnSelect="true">
    <ng-template>
        <ion-list class="dark-popover">
            <ion-item button routerLink="/tabs/settings">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="settings-outline"
                ></ion-icon>
                <ng-container i18n="@@settings">Impostazioni</ng-container>
            </ion-item>

            @if (isLoggedIn()) { @if (isAdmin()) {
            <ion-item button routerLink="/admin">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="shield-checkmark-outline"
                ></ion-icon>
                <ng-container i18n="@@admin">Admin</ng-container>
            </ion-item>
            } @if (isCat()) {
            <ion-item button routerLink="/cataloguer">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="library-outline"
                ></ion-icon>
                <ng-container i18n="@@cataloguer">Catalogatore</ng-container>
            </ion-item>
            } @if (isMod()) {
            <ion-item button routerLink="/mod">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="eye-outline"
                ></ion-icon>
                <ng-container i18n="@@moderation">Moderazione</ng-container>
            </ion-item>
            }

            <ion-item button (click)="logout()">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="log-out-outline"
                ></ion-icon>
                <ng-container i18n="@@logout">Esci</ng-container>
            </ion-item>
            } @if (!isLoggedIn()) {
            <ion-item button routerLink="/login">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="log-in-outline"
                ></ion-icon>
                <ng-container i18n="@@login">Accedi</ng-container>
            </ion-item>
            <ion-item button routerLink="/register">
                <ion-icon
                    color="primary"
                    slot="start"
                    name="person-add-outline"
                ></ion-icon>
                <ng-container i18n="@@register">Registrati</ng-container>
            </ion-item>
            }
        </ion-list>
    </ng-template>
</ion-popover>

<ion-tabs>
    <ion-header class="desktop-header ion-no-border">
        <ion-toolbar color="dark" mode="md">
            <ion-title slot="start" class="brand-title" routerLink="/tabs/home">
                NexuStream
            </ion-title>

            <ion-buttons
                slot="end"
                class="nav-links-desktop"
                [class.profile-menu-open]="isPopoverOpen"
            >
                <a
                    class="nav-link"
                    routerLink="/tabs/home"
                    routerLinkActive="active-tab"
                    i18n="@@home"
                    >Home</a
                >
                <a
                    class="nav-link"
                    routerLink="/tabs/search"
                    routerLinkActive="active-tab"
                    i18n="@@research"
                    >Cerca</a
                >
                <a
                    class="nav-link"
                    routerLink="/tabs/favourites"
                    routerLinkActive="active-tab"
                    i18n="@@favourites"
                    >Preferiti</a
                >

                <ion-button
                    fill="clear"
                    class="profile-icon-btn"
                    [class.active-profile]="isPopoverOpen"
                    (click)="openProfileMenu($event)"
                >
                    <ion-icon
                        slot="icon-only"
                        name="person-circle-outline"
                    ></ion-icon>
                </ion-button>
                @if (!isLoggedIn()){
                <app-language-switcher></app-language-switcher>
                }
            </ion-buttons>
        </ion-toolbar>
    </ion-header>
    <ion-tab-bar slot="bottom" [class.profile-menu-open]="isPopoverOpen">
        <ion-tab-button tab="home">
            <ion-icon name="home-outline"></ion-icon>
            <ion-label i18n="@@home">Home</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="search">
            <ion-icon name="search-outline"></ion-icon>
            <ion-label i18n="@@searchn">Cerca</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="favourites">
            <ion-icon name="heart-outline"></ion-icon>
            <ion-label i18n="@@favourites">Preferiti</ion-label>
        </ion-tab-button>

        <ion-tab-button (click)="openProfileMenu($event)" class="profile-btn">
            <ion-icon name="person-outline"></ion-icon>
            <ion-label i18n="@@profile">Profilo</ion-label>
        </ion-tab-button>
    </ion-tab-bar>
</ion-tabs>
