<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>NexuStream</title>

        <base href="/" />

        <script>
         (function() {
           var saved = localStorage.getItem('user_language_preferences');
           if (saved) {
             var targetLang = JSON.parse(saved).appLanguage;
             var currentLang = window.location.pathname.split('/')[1];
        
            // Se l'utente è entrato nella lingua sbagliata, blocca tutto e devia subito l'URL
             if (currentLang && (currentLang === 'it' || currentLang === 'en') && currentLang !== targetLang) {
              var newPath = window.location.pathname.replace('/' + currentLang + '/', '/' + targetLang + '/');
              window.location.href = window.location.origin + newPath + window.location.search;
             }
           }
         })();
        </script>

        <meta name="color-scheme" content="light dark" />
        <meta
            name="viewport"
            content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />

        <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

        <!-- add to homescreen for ios -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
